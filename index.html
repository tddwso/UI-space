<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UI 3D 房間</title>
<meta name="description" content="可操控角色在其中走動的 3D UI 元件房間，純 HTML／CSS／JS，可直接用 GitHub Pages 發布。">
<style>
  :root {
    --bg: #ffffff; --bg-subtle: #f6f8fa; --bg-inset: #eef1f4; --border: #d0d7de;
    --text: #1f2328; --text-muted: #656d76;
    --accent: #0969da; --accent-hover: #0757ba; --accent-text: #ffffff;
    --success: #1a7f37; --success-bg: #dafbe1; --warning: #9a6700; --warning-bg: #fff8c5;
    --danger: #cf222e; --danger-bg: #ffebe9; --info-bg: #ddf4ff;
    --shadow: 0 1px 2px rgba(31,35,40,.06), 0 4px 16px rgba(31,35,40,.08);
    --wall: #f3f5f8; --wall-top: #fbfcfd; --base: #dfe4ea;
    --floor: #8a5a35; --plank: rgba(0,0,0,.3);
    --ceil: #efe5cd; --light: rgba(255,244,200,.95);
    --board: rgba(255,255,255,.9); --dim: rgba(0,0,0,.06);
    --wood: #b27743; --plaster: #e6d9bd;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --bg-subtle: #161b22; --bg-inset: #21262d; --border: #30363d;
      --text: #e6edf3; --text-muted: #8b949e;
      --accent: #2f81f7; --accent-hover: #4493f8;
      --success: #3fb950; --success-bg: #12261e; --warning: #d29922; --warning-bg: #2d2411;
      --danger: #f85149; --danger-bg: #301a1f; --info-bg: #10243f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
      --wall: #151a21; --wall-top: #1b212a; --base: #0d1117;
      --floor: #4a3220; --plank: rgba(0,0,0,.45);
      --ceil: #2a261f; --light: rgba(255,236,170,.55);
      --board: rgba(13,17,23,.9); --dim: rgba(0,0,0,.42);
    --wood: #8a5c36; --plaster: #bfb299;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --bg-subtle: #161b22; --bg-inset: #21262d; --border: #30363d;
    --text: #e6edf3; --text-muted: #8b949e;
    --accent: #2f81f7; --accent-hover: #4493f8;
    --success: #3fb950; --success-bg: #12261e; --warning: #d29922; --warning-bg: #2d2411;
    --danger: #f85149; --danger-bg: #301a1f; --info-bg: #10243f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
    --wall: #151a21; --wall-top: #1b212a; --base: #0d1117;
    --floor: #4a3220; --plank: rgba(0,0,0,.45);
    --ceil: #2a261f; --light: rgba(255,236,170,.55);
    --board: rgba(13,17,23,.9); --dim: rgba(0,0,0,.42);
    --wood: #8a5c36; --plaster: #bfb299;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  code { font-family: var(--mono); font-size: .88em; background: var(--bg-inset); padding: .15em .4em; border-radius: 6px; }

  /* ================= 3D stage ================= */
  .viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background: #0b0e13; }
  .viewport.drag { cursor: grabbing; }
  .scene { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.32)); }

  .face { position: absolute; overflow: hidden; backface-visibility: hidden; user-select: none; -webkit-user-select: none; background: var(--wall); }
  .face input, .face textarea { user-select: text; -webkit-user-select: text; }
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--shade, none); }
  /* 牆面：上方木板、下方米色牆，仿照照片裡的房間 */
  .wall { left: -600px; top: -350px; width: 1200px; height: 700px; font-size: 16px; border: 1px solid rgba(0,0,0,.4);
    background-color: var(--plaster);
    background-image:
      repeating-linear-gradient(90deg, rgba(60,30,10,.4) 0 2px, transparent 2px 240px),
      linear-gradient(180deg, var(--wood) 0 62%, #4b2e18 62% 62.8%, var(--plaster) 62.8% 100%);
    background-size: 100% 62%, 100% 100%; background-position: top, top; background-repeat: no-repeat; }
  .wall::before { content: ""; position: absolute; inset: 0; background: var(--dim); pointer-events: none; }

  /* ================= 牆面裝飾 ================= */
  .deco { position: absolute; display: block; font-style: normal; }
  .frame { background: #fffdf8; padding: 7px; border: 5px solid #2b1d14; box-shadow: 0 6px 14px rgba(0,0,0,.4); }
  .frame > i { display: block; width: 100%; height: 100%; background-size: cover; background-position: center; }
  .poster { background: linear-gradient(160deg, #7a4dff, #ff6a3d 55%, #ffcf3d); border: 4px solid #2b1d14; color: #fff; font: italic 800 30px/1.1 "Brush Script MT", "Segoe Script", cursive, sans-serif; display: grid; place-items: center; text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.45); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
  .banner { background: #1a0707; color: #ff3b30; border: 2px solid #3a1010; font: 800 17px/1.2 sans-serif; letter-spacing: .1em; text-align: center; display: grid; place-items: center; text-shadow: 0 0 8px rgba(255,60,50,.85); box-shadow: 0 4px 10px rgba(0,0,0,.4); }
  .cork { background: radial-gradient(rgba(120,80,40,.4) 1px, transparent 1.6px) 0 0 / 8px 8px, #c99a62; border: 8px solid #6d4322; box-shadow: 0 6px 14px rgba(0,0,0,.4); }
  .cork b { position: absolute; width: 34px; height: 42px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
  .cork b::before { content: ""; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: #d32f2f; }
  .chart { background: repeating-linear-gradient(0deg, transparent 0 21px, rgba(40,70,170,.28) 21px 22px), repeating-linear-gradient(90deg, transparent 0 46px, rgba(40,70,170,.22) 46px 47px), #fbfbf8; border: 1px solid #cfcfc8; font: 14px/22px "Kaiti TC", "DFKai-SB", "KaiTi", "Comic Sans MS", cursive; color: #1c3fa8; padding: 6px 10px; box-shadow: 0 4px 10px rgba(0,0,0,.35); overflow: hidden; white-space: nowrap; }
  .lamp { width: 190px; height: 34px; border-radius: 8px; background: linear-gradient(#fffdf2, #efe9d0); border: 5px solid #e8dcb0; box-shadow: 0 0 34px 10px rgba(255,248,210,.55); }
  .win { background: linear-gradient(180deg, #bfe3ff, #e9f6ff 60%, #fff); border: 10px solid #efe9d8; box-shadow: inset 0 0 40px rgba(255,255,255,.8), 0 0 40px 6px rgba(255,244,200,.45); }
  .win::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 45%; background: repeating-linear-gradient(180deg, rgba(240,236,224,.96) 0 12px, rgba(180,190,200,.55) 12px 14px); }
  .clock { border-radius: 50%; background: #f7f7f2; border: 6px solid #3b3b3b; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
  .clock::before, .clock::after { content: ""; position: absolute; left: 50%; width: 3px; background: #222; transform-origin: 50% 100%; border-radius: 2px; }
  .clock::before { top: 12%; height: 38%; transform: rotate(32deg); }
  .clock::after { top: 24%; height: 26%; transform: rotate(-72deg); }
  .note { width: 34px; height: 34px; box-shadow: 0 2px 5px rgba(0,0,0,.35); }
  .floor, .ceil { left: -600px; top: -600px; width: 1200px; height: 1200px; }
  .w-n { transform: translateZ(-600px); }
  .w-s { transform: rotateY(180deg) translateZ(-600px); }
  .w-w { transform: rotateY(90deg) translateZ(-600px); --shade: linear-gradient(90deg, rgba(0,0,0,.10), transparent 45%); }
  .w-e { transform: rotateY(-90deg) translateZ(-600px); --shade: linear-gradient(270deg, rgba(0,0,0,.10), transparent 45%); }
  .w-s { --shade: linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,.06)); }
  .floor {
    transform: rotateX(90deg) translateZ(-350px);
    background-color: var(--floor);
    background-image: repeating-linear-gradient(90deg, var(--plank) 0 2px, transparent 2px 120px), linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.14));
    display: grid; place-items: center;
    --shade: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,.25));
  }
  .ceil {
    transform: rotateX(-90deg) translateZ(-350px) rotate(180deg);
    background: radial-gradient(circle at 50% 50%, var(--light), transparent 18%), var(--ceil);
    display: grid; place-items: center;
  }
  .ceil .rail { position: absolute; left: 34%; top: 0; width: 10px; height: 100%; background: #f4f4f4; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.3); }
  .ceil .spot { position: absolute; left: calc(34% - 14px); width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle, #fff 30%, var(--light) 60%, transparent 72%); }
  .ceil .recess { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: radial-gradient(circle, #fff 45%, #cfcfcf 62%, #8a8a8a 66%, transparent 68%); }
  .ceil h2 { margin: 220px 0 0; font-size: 44px; letter-spacing: .3em; color: var(--text-muted); opacity: .4; }

  .wall-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .wall-head h2 { margin: 0; font-size: 28px; letter-spacing: -.01em; }
  .wall-head span { color: var(--text-muted); font-size: 14px; }
  .lbl { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); font-weight: 600; }
  .lbl:first-of-type { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }


  /* ================= Character ================= */
  .char, .limb, .swing, .part { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  .cube { position: absolute; transform-style: preserve-3d; }
  .cf { position: absolute; backface-visibility: hidden; }
  .eye { position: absolute; width: 6px; height: 8px; border-radius: 2px; background: #1f2328; top: 52%; }
  .eye.l { left: 27%; } .eye.r { right: 27%; }
  .shadow { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.4), rgba(0,0,0,0) 70%); transform: rotateX(90deg) translateZ(2px); }
  .walk .legL .swing, .walk .armR .swing { animation: swA .56s ease-in-out infinite; }
  .walk .legR .swing, .walk .armL .swing { animation: swB .56s ease-in-out infinite; }
  .run .swing { animation-duration: .36s !important; }
  @keyframes swA { 0%, 100% { transform: rotateX(-38deg); } 50% { transform: rotateX(38deg); } }
  @keyframes swB { 0%, 100% { transform: rotateX(38deg); } 50% { transform: rotateX(-38deg); } }

  /* ================= HUD ================= */
  .hud { position: fixed; z-index: 20; }
  .hud-top { top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: #fff; background: linear-gradient(180deg, rgba(0,0,0,.55), transparent); pointer-events: none; }
  .hud-top > * { pointer-events: auto; }
  .brand { font-weight: 700; display: flex; align-items: center; gap: 10px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #2f81f7, #8250df); }
  .spacer { flex: 1; }
  .glass { font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: rgba(22,27,34,.62); border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: 6px 12px; cursor: pointer; backdrop-filter: blur(8px); }
  .glass:hover { background: rgba(48,54,61,.8); }
  .glass:focus-visible { outline: 2px solid #2f81f7; outline-offset: 2px; }

  .hud-bottom { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: calc(100vw - 24px); }
  .tele { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .tele .glass small { opacity: .75; font-weight: 500; margin-left: 4px; }
  .help { font-size: 12.5px; color: #fff; text-align: center; padding: 5px 12px; background: rgba(22,27,34,.55); border-radius: 999px; backdrop-filter: blur(6px); }
  .near { top: 58px; left: 50%; transform: translateX(-50%); padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: #fff; background: rgba(9,105,218,.85); box-shadow: 0 4px 16px rgba(0,0,0,.3); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .near.on { opacity: 1; }
  .mini { right: 14px; bottom: 14px; width: 120px; height: 120px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: rgba(22,27,34,.6); backdrop-filter: blur(8px); overflow: hidden; }
  .mini b { position: absolute; font-size: 11px; color: rgba(255,255,255,.7); font-weight: 600; }
  .mini .n { top: 3px; left: 50%; transform: translateX(-50%); } .mini .s { bottom: 3px; left: 50%; transform: translateX(-50%); }
  .mini .w { left: 5px; top: 50%; transform: translateY(-50%); } .mini .e { right: 5px; top: 50%; transform: translateY(-50%); }
  .mini i { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #2f81f7; border: 2px solid #fff; }
  .joy { display: none; left: 18px; bottom: 18px; width: 120px; height: 120px; border-radius: 50%; background: rgba(22,27,34,.45); border: 1px solid rgba(255,255,255,.3); touch-action: none; backdrop-filter: blur(6px); }
  .joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  @media (hover: none) and (pointer: coarse) {
    .joy { display: block; }
    .hud-bottom { bottom: 150px; }
    .mini { width: 96px; height: 96px; bottom: 18px; }
    .help { display: none; }
  }

  /* ================= Components ================= */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 600; font-size: 14px; padding: 7px 16px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text); transition: background .15s, transform .05s; }
  .btn:hover { background: var(--bg-inset); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .input:focus-visible, .select:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { color: var(--danger); } .btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
  .btn.ghost { background: transparent; border-color: transparent; } .btn.ghost:hover { background: var(--bg-inset); }
  .btn.sm { padding: 3px 10px; font-size: 12.5px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; pointer-events: none; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--bg-subtle); }
  .badge.success { color: var(--success); background: var(--success-bg); border-color: transparent; }
  .badge.warning { color: var(--warning); background: var(--warning-bg); border-color: transparent; }
  .badge.danger { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
  .badge.info { color: var(--accent); background: var(--info-bg); border-color: transparent; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .field { display: flex; flex-direction: column; gap: 5px; width: 100%; }
  .field label { font-size: 13.5px; font-weight: 600; }
  .hint { font-size: 12.5px; color: var(--text-muted); } .hint.error { color: var(--danger); }
  .input, .select, textarea.input { font: inherit; width: 100%; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .input::placeholder { color: var(--text-muted); }
  .input[aria-invalid="true"] { border-color: var(--danger); }
  textarea.input { min-height: 76px; resize: none; }
  .check, .radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
  .check input, .radio input { accent-color: var(--accent); width: 16px; height: 16px; }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track { width: 40px; height: 22px; border-radius: 999px; background: var(--border); position: relative; transition: background .2s; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .range { width: 100%; accent-color: var(--accent); }

  .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
  .card.raised { box-shadow: var(--shadow); }
  .card .thumb { height: 84px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 35%, var(--bg)), color-mix(in srgb, #8250df 35%, var(--bg))); }
  .card .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .card h3 { margin: 0; font-size: 16px; }
  .card p { margin: 0; color: var(--text-muted); font-size: 14px; }
  .card .foot { padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg-subtle); display: flex; gap: 8px; justify-content: flex-end; }
  .stat .num { font-size: 30px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .stat .delta { font-size: 13px; font-weight: 600; }
  .up { color: var(--success); } .down { color: var(--danger); }

  .alert { display: flex; gap: 12px; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--info-bg); width: 100%; font-size: 14px; }
  .alert strong { display: block; }
  .alert.success { background: var(--success-bg); } .alert.success strong { color: var(--success); }
  .alert.warning { background: var(--warning-bg); } .alert.warning strong { color: var(--warning); }
  .alert.danger { background: var(--danger-bg); } .alert.danger strong { color: var(--danger); }
  .alert.info strong { color: var(--accent); }

  .tablist { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
  .tab { font: inherit; background: none; border: 0; padding: 9px 14px; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .tabpanel { padding: 14px 4px 4px; color: var(--text-muted); font-size: 14px; }
  .tabpanel[hidden] { display: none; }

  .progress { width: 100%; height: 8px; border-radius: 999px; background: var(--bg-inset); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; border: 2px solid var(--bg); }
  .avatars { display: flex; } .avatars .avatar + .avatar { margin-left: -10px; }

  .tip { position: relative; }
  .tip::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(4px); background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 10px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
  .tip:hover::after { opacity: 1; transform: translateX(-50%); }

  .table-wrap { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--bg-subtle); font-size: 12.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--bg-subtle); }

  .swatches { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
  .swatch { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; font-size: 12px; background: var(--bg); }
  .swatch i { display: block; height: 52px; }
  .swatch span { display: block; padding: 6px 10px; font-family: var(--mono); color: var(--text-muted); }

  dialog .m-head { padding: 18px 20px 6px; font-size: 18px; font-weight: 700; }

  dialog .m-foot { padding: 12px 20px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--border); background: var(--bg-subtle); border-radius: 0 0 12px 12px; }
  .toasts { position: fixed; right: 16px; top: 60px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
  .toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); font-size: 14px; animation: pop .2s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px); } }

  @media (prefers-reduced-motion: reduce) { .spin, .swing { animation: none !important; } }

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var vp = $("vp"), scene = $("scene"), charEl = $("char");
  var FLOOR = 350, LIM = 552, TARGET_Y = FLOOR - 110;
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  /* ---------- 角色（用 CSS 方塊組成） ---------- */
  function mkFace(fw, fh, cw, ch, tf, col, shade) {
    var f = document.createElement("div");
    f.className = "cf";
    f.style.cssText = "width:" + fw + "px;height:" + fh + "px;left:" + ((cw - fw) / 2) + "px;top:" + ((ch - fh) / 2) + "px;" +
      "background:" + col + ";transform:" + tf + ";box-shadow:inset 0 0 0 999px " + shade;
    return f;
  }
  function cube(w, h, d, col) {
    var c = document.createElement("div");
    c.className = "cube";
    c.style.cssText = "left:" + (-w / 2) + "px;top:0;width:" + w + "px;height:" + h + "px";
    var f = {
      front: mkFace(w, h, w, h, "translateZ(" + d / 2 + "px)", col, "rgba(0,0,0,0)"),
      back: mkFace(w, h, w, h, "rotateY(180deg) translateZ(" + d / 2 + "px)", col, "rgba(0,0,0,.3)"),
      right: mkFace(d, h, w, h, "rotateY(90deg) translateZ(" + w / 2 + "px)", col, "rgba(0,0,0,.15)"),
      left: mkFace(d, h, w, h, "rotateY(-90deg) translateZ(" + w / 2 + "px)", col, "rgba(0,0,0,.22)"),
      top: mkFace(w, d, w, h, "rotateX(90deg) translateZ(" + h / 2 + "px)", col, "rgba(255,255,255,.18)"),
      bottom: mkFace(w, d, w, h, "rotateX(-90deg) translateZ(" + h / 2 + "px)", col, "rgba(0,0,0,.4)")
    };
    for (var k in f) c.appendChild(f[k]);
    c.f = f;
    c.front = f.front;
    return c;
  }
  function part(x, y, el, z) {
    var p = document.createElement("div");
    p.className = "part";
    p.style.transform = "translate3d(" + x + "px," + y + "px," + (z || 0) + "px)";
    p.appendChild(el);
    return p;
  }
  function limb(x, y, cls, w, h, d, col) {
    var l = document.createElement("div");
    l.className = "limb " + cls;
    l.style.transform = "translate3d(" + x + "px," + y + "px,0)";
    var s = document.createElement("div");
    s.className = "swing";
    s.appendChild(cube(w, h, d, col));
    l.appendChild(s);
    return l;
  }
  (function buildCharacter() {
    var skin = "#f2c9a0", shirt = "#2f81f7", pants = "#30363d", hair = "#3b2a20";
    var shadow = document.createElement("div"); shadow.className = "shadow"; charEl.appendChild(shadow);
    charEl.appendChild(limb(-13, -60, "legL", 22, 60, 24, pants));
    charEl.appendChild(limb(13, -60, "legR", 22, 60, 24, pants));
    charEl.appendChild(part(0, -124, cube(54, 64, 30, shirt)));
    charEl.appendChild(limb(-36, -121, "armL", 16, 58, 18, shirt));
    charEl.appendChild(limb(36, -121, "armR", 16, 58, 18, shirt));
    var head = cube(42, 42, 42, skin);
    ["l", "r"].forEach(function (s) { var e = document.createElement("i"); e.className = "eye " + s; head.front.appendChild(e); });
    charEl.appendChild(part(0, -166, head));
    charEl.appendChild(part(0, -171, cube(46, 14, 46, hair)));
  })();

  /* ---------- 房間陳設：貨架、塑膠箱、書桌（依照片重現） ---------- */
  var propsEl = $("props");
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  // b = 離地高度；y0 = 父層原點的世界 y（貨架內用 0，整個房間用 FLOOR）
  function box(parent, w, h, d, col, x, b, z, y0) {
    var c = cube(w, h, d, col);
    parent.appendChild(part(x, y0 - b - h, c, z));
    return c;
  }
  var NOTE = ["#f7e66b", "#ffffff", "#9ae6b4", "#f6a5a5", "#a5c8f6"];
  var SUB = ["94,70,46", "126,98,62", "58,46,34", "110,84,54"];

  // rot：0 = 長邊沿 z 軸（東／西牆）、90 = 長邊沿 x 軸（北／南牆）；sign：走道在本地 -x(-1) 或 +x(1)
  function rack(cx, cz, rot, sign) {
    var g = document.createElement("div");
    g.className = "part";
    g.style.transform = "translate3d(" + cx + "px," + FLOOR + "px," + cz + "px) rotateY(" + rot + "deg)";
    var L = 300, DEP = 100, H = 250;
    var sh = document.createElement("div");
    sh.className = "cf";
    sh.style.cssText = "width:" + (DEP + 40) + "px;height:" + (L + 40) + "px;left:" + (-(DEP + 40) / 2) + "px;top:" + (-(L + 40) / 2) + "px;" +
      "background:radial-gradient(ellipse at center, rgba(0,0,0,.38), rgba(0,0,0,0) 70%);transform:rotateX(90deg) translateZ(1px)";
    g.appendChild(sh);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (s) {
      box(g, 6, H, 6, "#1d2026", s[0] * (DEP / 2 - 3), 0, s[1] * (L / 2 - 3), 0);
    });
    [18, 98, 178, 244].forEach(function (b) { box(g, DEP, 5, L, "#2a2e35", 0, b, 0, 0); });
    [18, 98, 178].forEach(function (b) {
      [-1, 1].forEach(function (k) {
        var bin = box(g, 88, 56, 134, "rgba(205,222,235,.36)", 0, b + 5, k * 72, 0);
        var side = sign < 0 ? bin.f.left : bin.f.right;
        var fill = 18 + Math.round(rnd() * 34);
        var sub = SUB[Math.floor(rnd() * SUB.length)];
        side.style.background = "linear-gradient(180deg, rgba(205,222,235,.34) 0 " + (100 - fill) + "%, rgba(" + sub + ",.82) " + (100 - fill) + "% 100%)";
        bin.f.top.style.background = "rgba(228,238,246,.55)";
        if (rnd() > 0.25) {
          var n = document.createElement("i");
          n.style.cssText = "position:absolute;left:" + (8 + Math.round(rnd() * 60)) + "%;top:" + (10 + Math.round(rnd() * 20)) + "%;" +
            "width:22px;height:18px;background:" + NOTE[Math.floor(rnd() * NOTE.length)] + ";transform:rotate(" + (Math.round(rnd() * 10) - 5) + "deg);box-shadow:0 1px 2px rgba(0,0,0,.3)";
          side.appendChild(n);
        }
      });
    });
    propsEl.appendChild(g);
  }
  [-300, 0, 300].forEach(function (z) { rack(540, z, 0, -1); });      // 東牆 3 組
  [-300, 0].forEach(function (z) { rack(-540, z, 0, 1); });            // 西牆 2 組（南側留給書桌）
  [-300, 0, 300].forEach(function (x) { rack(x, -540, 90, -1); });   // 北牆 3 組
  [-300, 300].forEach(function (x) { rack(x, 540, 90, 1); });          // 南牆 2 組

  (function furniture() {
    var WOOD = "#8a5a35", WOOD_D = "#5d3b22", CARD = "#c9a06c", CARD_D = "#b98f5a";
    // 書桌（西南角）
    box(propsEl, 100, 8, 300, WOOD, -545, 100, 300, FLOOR);
    box(propsEl, 90, 100, 14, WOOD_D, -545, 0, 158, FLOOR);
    box(propsEl, 90, 100, 14, WOOD_D, -545, 0, 442, FLOOR);
    box(propsEl, 8, 92, 300, WOOD_D, -591, 8, 300, FLOOR);
    // 桌上：紙箱、電子秤、杯子、塑膠盒
    box(propsEl, 58, 42, 58, CARD, -548, 108, 400, FLOOR);
    box(propsEl, 50, 34, 50, CARD_D, -548, 150, 400, FLOOR);
    box(propsEl, 34, 6, 26, "#222", -540, 108, 300, FLOOR);
    box(propsEl, 16, 16, 16, "#f4f4f4", -520, 108, 340, FLOOR);
    box(propsEl, 16, 16, 16, "#f4f4f4", -560, 108, 345, FLOOR);
    box(propsEl, 70, 38, 64, "rgba(255,255,255,.5)", -545, 108, 230, FLOOR);
    // 地上：竹板凳、白色大收納箱、牆角紙箱
    box(propsEl, 44, 56, 44, "#c8a15a", -420, 0, 380, FLOOR);
    box(propsEl, 90, 70, 120, "rgba(255,255,255,.5)", -330, 0, 300, FLOOR);
    box(propsEl, 62, 52, 62, CARD, -550, 0, 545, FLOOR);
    box(propsEl, 56, 44, 56, CARD_D, -550, 52, 545, FLOOR);
  })();

  // 碰撞範圍 [x1, x2, z1, z2]
  var COL = [
    [490, 600, -460, 460], [-600, -490, -460, 150], [-460, 460, -600, -490],
    [-460, -140, 490, 600], [140, 460, 490, 600],
    [-600, -490, 150, 450], [-445, -395, 355, 405], [-380, -280, 236, 364], [-585, -515, 510, 580]
  ];
  function blocked(x, z) {
    for (var i = 0; i < COL.length; i++) {
      var r = COL[i];
      if (x > r[0] - 24 && x < r[1] + 24 && z > r[2] - 24 && z < r[3] + 24) return true;
    }
    return false;
  }

  /* ---------- 狀態 ---------- */
  var S = { x: 0, z: 140, h: 180 };                       // 角色位置與朝向（度）
  var C = { x: 0, z: 140, yaw: 0, pitch: 22, D: 430 };    // 相機
  var K = {}, J = { x: 0, y: 0 };

  function persp() {
    var vw = innerWidth, vh = innerHeight;
    var b = vw < 700 ? vw * 1.1 : Math.min(vw * 0.55, vh);
    return Math.max(300, b);
  }
  function render() {
    var p = persp();
    vp.style.perspective = p + "px";
    scene.style.transform = "translateZ(" + (p - C.D) + "px) rotateX(" + (-C.pitch) + "deg) rotateY(" + C.yaw + "deg) translate3d(" + (-C.x) + "px," + (-TARGET_Y) + "px," + (-C.z) + "px)";
    charEl.style.transform = "translate3d(" + S.x + "px," + FLOOR + "px," + S.z + "px) rotateY(" + S.h + "deg)";
  }

  /* ---------- 輸入：鍵盤 ---------- */
  var typing = function (t) { return t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable); };
  var TELE = { n: [0, -360, 0, 180], w: [-360, 0, -90, 90 * -1], e: [360, 0, 90, 90], s: [0, 360, 180, 0] };
  function teleport(k) {
    var t = TELE[k]; if (!t) return;
    S.x = t[0]; S.z = t[1]; S.h = t[3];
    C.x = S.x; C.z = S.z; C.yaw = t[2]; C.pitch = 18; C.D = 400;
  }
  function resetCam() { C.yaw = 0; C.pitch = 22; C.D = 430; }
  var MOVE = { w: 1, a: 1, s: 1, d: 1, q: 1, e: 1, shift: 1, arrowup: 1, arrowdown: 1, arrowleft: 1, arrowright: 1 };
  addEventListener("keydown", function (e) {
    if (typing(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (MOVE[k]) { K[k] = true; if (k.indexOf("arrow") === 0) e.preventDefault(); }
    else if (k === "r") resetCam();
    else if (k === "1") teleport("n");
    else if (k === "2") teleport("w");
    else if (k === "3") teleport("e");
    else if (k === "4") teleport("s");
  });
  addEventListener("keyup", function (e) { K[e.key.toLowerCase()] = false; });
  addEventListener("blur", function () { K = {}; });

  /* ---------- 輸入：拖曳轉視角／雙指縮放／滾輪 ---------- */
  var INTERACTIVE = "button,input,select,textarea,label,a,output,[role=tab]";
  var ptrs = new Map(), pinch0 = 0, D0 = 430;
  var dist = function (a, b) { return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  vp.addEventListener("pointerdown", function (e) {
    if (e.target.closest(INTERACTIVE)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { vp.setPointerCapture(e.pointerId); } catch (_) {}
    vp.classList.add("drag");
    if (ptrs.size === 2) { var a = Array.from(ptrs.values()); pinch0 = dist(a[0], a[1]); D0 = C.D; }
  });
  vp.addEventListener("pointermove", function (e) {
    var o = ptrs.get(e.pointerId); if (!o) return;
    var dx = e.clientX - o.x, dy = e.clientY - o.y;
    o.x = e.clientX; o.y = e.clientY;
    if (ptrs.size === 1) {
      C.yaw -= dx * 0.28;
      C.pitch = clamp(C.pitch + dy * 0.2, 5, 75);
    } else if (ptrs.size === 2) {
      var a = Array.from(ptrs.values());
      C.D = clamp(D0 * pinch0 / dist(a[0], a[1]), 220, 1000);
    }
  });
  function endPtr(e) { ptrs.delete(e.pointerId); if (!ptrs.size) vp.classList.remove("drag"); }
  vp.addEventListener("pointerup", endPtr);
  vp.addEventListener("pointercancel", endPtr);
  vp.addEventListener("wheel", function (e) {
    e.preventDefault();
    C.D = clamp(C.D * Math.exp(e.deltaY * 0.001), 220, 1000);
  }, { passive: false });

  /* ---------- 輸入：虛擬搖桿（觸控） ---------- */
  var joy = $("joy"), knob = $("knob"), joyId = null;
  function joyMove(e) {
    var r = joy.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    var m = Math.hypot(dx, dy), max = 44;
    if (m > max) { dx = dx / m * max; dy = dy / m * max; }
    J.x = dx / max; J.y = dy / max;
    knob.style.transform = "translate(" + dx + "px," + dy + "px)";
  }
  joy.addEventListener("pointerdown", function (e) { joyId = e.pointerId; joy.setPointerCapture(joyId); joyMove(e); });
  joy.addEventListener("pointermove", function (e) { if (e.pointerId === joyId) joyMove(e); });
  function joyEnd(e) { if (e.pointerId !== joyId) return; joyId = null; J.x = 0; J.y = 0; knob.style.transform = ""; }
  joy.addEventListener("pointerup", joyEnd);
  joy.addEventListener("pointercancel", joyEnd);

  /* ---------- 主迴圈 ---------- */
  var near = $("near"), mini = $("mini"), dot = $("miniDot");
  var WALLS = [
    { name: "北牆", d: function () { return S.z + 600; } },
    { name: "西牆", d: function () { return S.x + 600; } },
    { name: "東牆", d: function () { return 600 - S.x; } },
    { name: "南牆", d: function () { return 600 - S.z; } }
  ];
  var lastNear = "", last = performance.now();
  function loop(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t;

    if (K.q) C.yaw -= 120 * dt;
    if (K.e) C.yaw += 120 * dt;

    var ix = ((K.d || K.arrowright) ? 1 : 0) - ((K.a || K.arrowleft) ? 1 : 0) + J.x;
    var iy = ((K.w || K.arrowup) ? 1 : 0) - ((K.s || K.arrowdown) ? 1 : 0) - J.y;
    var len = Math.hypot(ix, iy);
    if (len > 1) { ix /= len; iy /= len; len = 1; }
    var moving = len > 0.1;
    var run = !!K.shift;

    if (moving) {
      var yr = C.yaw * Math.PI / 180, sp = run ? 460 : 280;
      var dx = Math.sin(yr) * iy + Math.cos(yr) * ix;
      var dz = -Math.cos(yr) * iy + Math.sin(yr) * ix;
      var nx = clamp(S.x + dx * sp * dt, -LIM, LIM), nz = clamp(S.z + dz * sp * dt, -LIM, LIM);
      if (!blocked(nx, S.z)) S.x = nx;
      if (!blocked(S.x, nz)) S.z = nz;
      var th = Math.atan2(dx, dz) * 180 / Math.PI;
      var d = ((th - S.h) % 360 + 540) % 360 - 180;
      S.h += d * (1 - Math.exp(-dt * 14));
    }
    charEl.classList.toggle("walk", moving);
    charEl.classList.toggle("run", moving && run);

    var a = 1 - Math.exp(-dt * 12);
    C.x += (S.x - C.x) * a;
    C.z += (S.z - C.z) * a;
    render();

    // 靠近牆面提示
    var best = null, bd = 170;
    WALLS.forEach(function (w) { var v = w.d(); if (v < bd) { bd = v; best = w; } });
    var txt = best ? "靠近 " + best.name : "";
    if (txt !== lastNear) { lastNear = txt; near.textContent = txt; near.classList.toggle("on", !!txt); }

    // 小地圖
    dot.style.left = ((S.x + 600) / 1200 * 100) + "%";
    dot.style.top = ((S.z + 600) / 1200 * 100) + "%";

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  if (innerWidth < 700) C.D = 330;

  $("tele").addEventListener("click", function (e) {
    var b = e.target.closest("[data-t]"); if (b) teleport(b.getAttribute("data-t"));
  });
  $("resetBtn").addEventListener("click", resetCam);

  /* ---------- 主題 ---------- */
  try { var saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  $("themeBtn").addEventListener("click", function () {
    var isDark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var next = isDark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });
})();
</script>
</body>
</html>
